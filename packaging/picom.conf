# The minimum compositor config for a translucent hark! window on X11.
#
#   picom -b --config packaging/picom.conf
#
# **The Linux build is opaque** — `tauri.linux.conf.json` turns transparency
# off, because on this stack WebKitGTK composites the page opaque no matter
# what the window asks for: with a compositor running and a bright wallpaper
# behind it, the UI still measured as flat `--ink`. See the Linux vs macOS
# section of CLAUDE.md. This file is what you need in place to retry that after
# a WebKitGTK bump, since a compositor is a precondition either way: i3 does
# not composite, and without one X11 has nowhere to put the alpha channel.
#
# There are deliberately no opacity rules here. hark! draws its own alpha
# (the window's `transparent` flag plus --ink-translucent in the CSS), so picom
# only has to composite what the app already produced — forcing window opacity
# on top of that would wash out the cover art, which is the one thing the
# design refuses to compromise.

backend = "glx";
vsync = true;

# No shadows, no fade, no blur: same reason the stylesheet has no shadows.
shadow = false;
fading = false;
