# The minimum compositor config for a translucent hark! window on X11.
#
#   picom -b --config packaging/picom.conf
#
# **This is required, not optional.** i3 does not composite, and without a
# compositor X11 has nowhere to put the alpha channel — the 50% background
# renders black instead of showing the desktop. Start picom before hark, or
# from your i3 config.
#
# Transparency was dead on Linux until WebKitGTK stopped being forced onto its
# unaccelerated renderer (WEBKIT_DISABLE_DMABUF_RENDERER=1 in flake.nix, now 0).
# A compositor was always necessary and never sufficient: that is why this file
# existed for a release while the window was still opaque.
#
# There are deliberately no opacity rules here. hark! draws its own alpha
# (the window's `transparent` flag plus --ink-translucent in the CSS), so picom
# only has to composite what the app already produced — forcing window opacity
# on top of that would wash out the cover art, which is the one thing the
# design refuses to compromise.

backend = "glx";
vsync = true;

# No shadows, no fade, no blur: same reason the stylesheet has no shadows.
shadow = false;
fading = false;
